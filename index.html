<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모으기">
<meta name="theme-color" content="#d5e07b">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<title>모으기</title>
<style>
/* 스타일 규칙은 STYLE.md 참고 */
:root {
  --field: #d5e07b; --field-dark: #a8c45c; --cream: #f3dfb8; --cream-2: #e8c99a; --paper: #fff4dc;
  --tan: #d4a373; --brown: #b07a52; --ink: #6a4636; --sub: #a57c5e; --track: #7d6157;
  --green: #a6cf63; --green-dark: #5e7a3a; --gold: #f2b84b; --red: #d0694e; --blue: #7fb2d9;
  --round: polygon(0 6px, 2px 6px, 2px 2px, 6px 2px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 2px, calc(100% - 2px) 2px,
    calc(100% - 2px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 2px) calc(100% - 6px), calc(100% - 2px) calc(100% - 2px),
    calc(100% - 6px) calc(100% - 2px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 6px), 0 calc(100% - 6px));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--field); transition: background-color 1.2s steps(6); }
/* 배경 풍경: 흘러가는 구름 + 동산 (색은 레벨 들판색을 따라감) */
#scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.cloud { position: absolute; left: 0; animation: drift linear infinite; }
@keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(110vw); } }
.hills { position: absolute; left: 0; bottom: 0; }
#scene .hills { bottom: calc(46px + env(safe-area-inset-bottom)); }
.hill-b { fill: var(--field-dark); opacity: .45; } .hill-f { fill: var(--field-dark); } .hill-t { fill: #fff; opacity: .35; }
@media (prefers-reduced-motion: reduce) { .cloud { animation: none; transform: translateX(30vw); } }
body { color: var(--ink); font: 14px/1.5 'Galmuri11', monospace; -webkit-font-smoothing: none;
  padding: calc(12px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; }
button, input, select { font: inherit; color: inherit; border: 0; background: none; border-radius: 0; }
button { cursor: pointer; }
/* 키보드 포커스: clip-path가 바깥 outline을 잘라서 안쪽 점선으로 */
:focus-visible { outline: 3px dashed var(--green-dark); outline-offset: -6px; }
input, select { font-size: 16px; width: 100%; background: var(--paper); border: 2px solid var(--brown); padding: 8px 10px; color: var(--ink);
  -webkit-user-select: text; user-select: text; }
input::placeholder { color: var(--sub); opacity: .7; }
main { max-width: 480px; margin: 0 auto; }
h2 { font-size: 13px; color: var(--ink); font-weight: 400; margin: 22px 2px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h2::before { content: "■"; color: var(--green-dark); }
h2 > span:first-child { margin-right: auto; }
h2 > span:last-child:not(:first-child) { color: var(--sub); }

.box { background: var(--cream); border: 2px solid var(--brown); border-bottom-width: 6px; border-bottom-color: var(--tan);
  clip-path: var(--round); padding: 14px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.num { font-size: 22px; letter-spacing: -.5px; }
.big { font-size: 30px; line-height: 1.2; }
.unit { font-size: 15px; }
.sub, .hint { color: var(--sub); font-size: 12px; }
.up { color: var(--green-dark); } .down { color: var(--red); } .gold { color: #c98a1e; }
.empty { color: var(--sub); text-align: center; padding: 18px 0; font-size: 13px; }

.btn { display: block; width: 100%; padding: 12px 10px; background: var(--cream); color: var(--ink); clip-path: var(--round);
  border: 2px solid var(--brown); border-bottom: 5px solid var(--tan); }
.btn.go { background: var(--green); color: var(--green-dark); border-color: var(--green-dark); }
.btn.danger { background: var(--red); color: var(--paper); border-color: #8f4130; }
.btn:disabled { background: var(--cream-2); color: var(--sub); border-color: var(--tan); }
.btn:active:not(:disabled), .key:active, .tile:active, .seg button:active, .fab:active {
  transform: translateY(3px); border-bottom-width: 2px; filter: brightness(.95); }

/* HUD */
.hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
.lv { background: var(--green); color: var(--green-dark); border: 2px solid var(--green-dark); padding: 2px 8px; clip-path: var(--round); }
.purse { background: var(--paper); border: 2px solid var(--brown); padding: 2px 8px; clip-path: var(--round); display: flex; align-items: center; gap: 6px; }

button.lv:active { transform: translateY(2px); }

/* 모달: 레벨표 · 축하 */
#modal { position: fixed; inset: 0; background: rgba(106,70,54,.45); z-index: 12; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal:empty { display: none; }
.modal { width: 100%; max-width: 360px; display: grid; gap: 12px; position: relative; overflow: hidden; background: var(--paper); }
.icon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.icon-grid .pix { width: 28px; height: 28px; }
.pick { padding: 2px; background: var(--paper); border: 2px solid var(--tan); clip-path: var(--round); } /* 설정: 눌러서 아이콘 바꾸기 */
.party-t { font-size: 30px; text-align: center; color: var(--green-dark); text-shadow: 3px 3px 0 var(--gold); animation: pop .5s steps(4) both; }
.party-m { text-align: center; font-size: 16px; line-height: 1.7; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.rain { position: absolute; inset: 0; pointer-events: none; }
.modal > :not(.rain) { position: relative; z-index: 1; } /* 글자가 떨어지는 동전 위에 */
.rain .coin { position: absolute; top: -20px; animation: fall 1.6s cubic-bezier(.4,0,1,1) both; }
@keyframes fall { to { transform: translateY(560px); } }

/* 저금통 무대: 하늘 + 들판 */
.stage { display: grid; grid-template-columns: 192px 1fr; gap: 12px; align-items: end;
  background: #d9eef2; position: relative; } /* 하늘: 크림색 구름이 보이게 연한 하늘색 */
.stage-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; } /* 구름이 무대 밖으로 나가 페이지가 넓어지지 않게 */
.stage-bg .hills { bottom: -44px; } /* 무대에선 동산 윗부분만 */
.stage > :not(.stage-bg) { position: relative; z-index: 1; }
#jar { width: 192px; height: 208px; image-rendering: pixelated; display: block; }
.stage .label { color: var(--sub); font-size: 11px; }
.stage .num { font-size: 17px; white-space: nowrap; margin-bottom: 8px; }
.stage .hint { line-height: 1.6; margin: 4px 0 18px; }
.pbar { height: 14px; background: var(--track); border: 2px solid var(--ink); margin: 4px 0 2px; padding: 2px; }
.pbar i { display: block; height: 100%; background: var(--green); }

/* 대화창 */
.dialog { margin-top: 12px; background: var(--paper); line-height: 1.7; position: relative; padding-right: 28px; }
.dialog .face { color: var(--green-dark); }
.blink { position: absolute; right: 10px; bottom: 6px; animation: blink 1s steps(1) infinite; color: var(--brown); }
@keyframes blink { 50% { opacity: 0; } }

/* 퀘스트: 줄 전체가 버튼 */
.quest { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; margin-bottom: 8px; text-align: left;
  background: var(--paper); border: 2px solid var(--tan); border-bottom-width: 4px; clip-path: var(--round); }
.quest:last-child { margin-bottom: 0; }
.quest .q { flex: 1; min-width: 0; }
.quest .q div:last-child { color: var(--sub); font-size: 11px; margin-top: 2px; }
.quest .st { font-size: 13px; padding: 7px 12px; clip-path: var(--round); white-space: nowrap; background: var(--gold); color: var(--ink);
  border: 2px solid #a8701a; border-bottom-width: 4px; }
.quest .st:active { transform: translateY(2px); border-bottom-width: 2px; }
.quest.done { background: #eef5d8; border-color: var(--green); }
.quest.done .st { background: var(--green); color: var(--green-dark); border-color: var(--green-dark); }
.coin { display: inline-block; width: 18px; height: 18px; flex: none;
  clip-path: polygon(30% 0, 70% 0, 70% 10%, 90% 10%, 90% 30%, 100% 30%, 100% 70%, 90% 70%, 90% 90%, 70% 90%, 70% 100%, 30% 100%, 30% 90%, 10% 90%, 10% 70%, 0 70%, 0 30%, 10% 30%, 10% 10%, 30% 10%);
  box-shadow: inset -3px -3px 0 rgba(106,70,54,.35), inset 3px 3px 0 rgba(255,255,255,.5); }

/* HP */
.hp { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; margin: 8px 0; padding: 3px; background: var(--track); border: 2px solid var(--ink); }
.hp i { height: 14px; background: rgba(255,255,255,.08); }
.hp.g i.on { background: var(--green); } .hp.y i.on { background: var(--gold); } .hp.r i.on { background: var(--red); }

/* 지출 탭 */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { padding: 8px; background: var(--cream); color: var(--sub); clip-path: var(--round); border: 2px solid var(--brown); border-bottom: 5px solid var(--tan); }
.seg button.on { background: var(--green); color: var(--green-dark); border-color: var(--green-dark); }
.period { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; font-size: 16px; }
.period button { width: 44px; height: 36px; font-size: 18px; color: var(--brown); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 130px; margin-top: 12px; }
.week button { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 11px; color: var(--sub); }
.week b { display: block; width: 100%; background: var(--green); min-height: 2px; font-weight: 400; border: 2px solid var(--green-dark); border-bottom: 0; }
.week button.today { color: var(--ink); } .week button.today b { background: var(--gold); border-color: #a8701a; }
.week small { font-size: 10px; color: var(--ink); min-height: 14px; }
.cat { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 8px; align-items: center; margin: 10px 0; font-size: 13px; }
.cat .pbar { grid-column: 2 / 4; margin: 0; height: 12px; padding: 1px; }
.day-h { display: flex; justify-content: space-between; color: var(--sub); font-size: 12px; padding: 12px 0 4px; border-bottom: 2px solid var(--cream-2); }
.day-h:first-child { padding-top: 0; }
.tx { display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px 0; text-align: left; }
.tx .ic { width: 28px; display: flex; justify-content: center; }
.pix { width: 24px; height: 24px; display: block; image-rendering: pixelated; }
.cat .pix, .cmp .pix { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }
.tx .l { flex: 1; min-width: 0; }
.tx .l div:last-child { color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .r { text-align: right; }
.tx s { color: var(--sub); font-size: 11px; display: block; }
.tag { font-size: 10px; padding: 1px 5px; background: var(--green); color: var(--green-dark); margin-left: 4px; vertical-align: 1px; }
.wallet { display: block; width: 100%; text-align: left; background: var(--paper); }
.wallet:active { transform: translateY(3px); border-bottom-width: 3px; }
.wallet .plus { font-size: 12px; padding: 3px 8px; background: var(--green); color: var(--green-dark); clip-path: var(--round); }
.income-row { display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; margin-top: 6px; font-size: 13px;
  background: #eef5d8; border: 2px solid var(--green); clip-path: var(--round); }
.addrow { width: 100%; padding: 10px; border: 2px dashed var(--brown); color: var(--brown); margin-top: 8px; background: var(--paper); }

/* 비교 */
.cmp { display: grid; grid-template-columns: 92px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; margin: 10px 0; }
.cmp .bars i { display: block; height: 8px; margin: 2px 0; background: var(--green); }
.cmp .bars i.prev { background: var(--tan); }
.cmp b { text-align: right; font-weight: 400; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; margin-top: 10px;
  background: var(--paper); padding: 8px; clip-path: var(--round); }
.vs .sub { display: block; }

/* 설정 */
.set { display: grid; gap: 6px; grid-template-columns: 40px 1fr 104px 30px; align-items: center; margin-bottom: 8px; }
.set input[type=color] { padding: 2px; height: 40px; }
.x { color: var(--red); font-size: 18px; }
.field { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
.field .unit { font-size: 12px; color: var(--sub); }

/* 탭바 */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--cream); border-top: 2px solid var(--brown);
  box-shadow: 0 -4px 0 var(--field-dark); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; padding: 14px 0 12px; font-size: 14px; color: var(--sub); }
nav button.on { color: var(--ink); }
nav button.on::before { content: "▶"; font-size: 10px; margin-right: 3px; color: var(--green-dark); animation: blink 1s steps(1) infinite; }
.fab { position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); width: 60px; height: 60px; z-index: 6;
  background: var(--green); color: var(--paper); font-size: 34px; clip-path: var(--round);
  border: 2px solid var(--green-dark); border-bottom: 6px solid var(--green-dark); text-shadow: 2px 2px 0 var(--green-dark); }

/* 입력 시트 */
#sheet { position: fixed; inset: 0; background: rgba(106,70,54,.45); z-index: 10; display: flex; align-items: flex-end; }
#sheet:empty { display: none; }
.sheet { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: calc(14px + env(safe-area-inset-bottom));
  display: grid; gap: 12px; max-height: 94vh; overflow-y: auto; border-bottom-width: 2px; }
.sheet .title { color: var(--ink); }
.amount { font-size: 34px; text-align: right; padding: 6px 10px; background: var(--paper); border: 2px solid var(--brown); min-height: 62px; clip-path: var(--round); }
.amount.zero { color: var(--tan); }
.amount::after { content: "_"; color: var(--green-dark); animation: blink 1s steps(1) infinite; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile { padding: 8px 4px; background: var(--paper); clip-path: var(--round); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid var(--tan); border-bottom-width: 4px; }
.tile .ic .pix { width: 30px; height: 30px; }
.tile.on { background: var(--green); color: var(--green-dark); border-color: var(--green-dark); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key { padding: 10px 0; font-size: 20px; background: #ffe9a8; color: var(--ink); clip-path: var(--round); border: 2px solid #c98a1e; border-bottom: 5px solid #d9a441; }
.key[data-k="00"], .key[data-k="0"] { background: #fff4dc; border-color: var(--brown); border-bottom-color: var(--tan); }
.key[data-k="⌫"] { background: #f6c3b0; color: #8f4130; border-color: #a8503a; border-bottom-color: #c9705a; }
details summary { color: var(--sub); font-size: 13px; list-style: none; padding: 2px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "▸ "; }
details[open] summary::before { content: "▾ "; }
.more { display: grid; gap: 8px; margin-top: 8px; }
.more label { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 8px; font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.two > :only-child { grid-column: 1 / 3; }

@media (prefers-reduced-motion: reduce) { .blink, nav button.on::before, .amount::after, .party-t { animation: none; } }
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<main id="app"></main>

<button class="fab" data-act="new" aria-label="지출 기록하기">+</button>
<nav>
  <button data-view="home">홈</button>
  <button data-view="expense">지출</button>
  <button data-view="compare">비교</button>
  <button data-view="settings">설정</button>
</nav>

<div id="sheet"></div>
<div id="modal"></div>
<input type="file" id="import" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
